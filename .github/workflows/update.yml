name: Actualizar datos
on:
  schedule:
    - cron: "0 14 * * *"  # 09:00 Colombia
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build completo (re-descarga fresca)
        run: PYTHONPATH=src python -m fpc_api.build all --max-age-days 0
      - name: Validar
        run: PYTHONPATH=src python -m fpc_api.validate
      - name: Commit si cambió algo
        run: |
          git config user.name "fpc-api-bot"
          git config user.email "bot@users.noreply.github.com"
          if [[ -n $(git status --porcelain docs/v1) ]]; then
            git add docs/v1
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en los datos"
          fi
